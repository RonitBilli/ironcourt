<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- The iPhone app loads videos through this https page so YouTube gets a normal web referrer. -->
<script>
  const q = new URLSearchParams(location.search);
  const id = (q.get("v") || "").replace(/[^\w-]/g, "").slice(0, 11);
  const demo = q.get("demo") === "1";
  const p = demo
    ? `autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&disablekb=1&iv_load_policy=3&playsinline=1&rel=0&modestbranding=1`
    : "playsinline=1&rel=0&modestbranding=1&iv_load_policy=3";
  if (id) {
    const f = document.createElement("iframe");
    f.src = `https://www.youtube.com/embed/${id}?${p}`;
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    document.body.appendChild(f);
  }
</script>
</body>
</html>
